openapi: 3.0.3
info:
  title: Contributor Profile Redirect API
  version: 0.1.0
  description: Backend contract for contributor login redirect, profile ensure, and authenticated profile lookup.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Authenticate a user and return tokens plus public user data
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      summary: Return the current authenticated user
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /contributors/profiles/me/ensure:
    post:
      summary: Ensure the authenticated contributor has a contributor profile
      responses:
        '201':
          description: Contributor profile created or returned idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /contributors/profiles/{username}:
    get:
      summary: Load a contributor profile by canonical username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{2,29}$'
      responses:
        '200':
          description: Contributor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-access-token
  responses:
    Unauthorized:
      description: Missing, expired, revoked, or invalid credentials/token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user is not allowed for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Profile was not found or is hidden by account status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Username or profile uniqueness conflict could not be resolved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Valid request contains semantically invalid profile source data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthSession:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresAt
        - refreshExpiresAt
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
    AuthUser:
      type: object
      required:
        - id
        - email
        - username
        - firstName
        - lastName
        - avatarUrl
        - role
        - status
        - preferredLanguage
        - createdAt
        - updatedAt
        - lastLoginAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{2,29}$'
          description: Non-null for contributors returned by this redirect flow.
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, contributor, admin]
        status:
          type: string
          enum: [pending, active, suspended, deactivated]
        preferredLanguage:
          type: string
          enum: [ar, en]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    ContributorProfile:
      type: object
      required:
        - username
        - displayName
        - avatarUrl
        - roleLabel
        - bio
        - skills
        - availability
        - githubStatus
        - reputationSummary
        - contributionHistory
        - completionPrompts
        - viewerRelationship
      properties:
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{2,29}$'
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        roleLabel:
          type: string
          example: Contributor
        bio:
          type: string
          nullable: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillSummary'
        availability:
          type: string
          nullable: true
        githubStatus:
          $ref: '#/components/schemas/GitHubStatus'
        reputationSummary:
          $ref: '#/components/schemas/ReputationSummary'
        contributionHistory:
          type: array
          items:
            type: object
        completionPrompts:
          type: array
          items:
            type: string
        viewerRelationship:
          type: string
          enum: [owner, authenticated-viewer]
    SkillSummary:
      type: object
      required:
        - name
        - proficiencyLevel
        - confidence
        - status
      properties:
        name:
          type: string
        proficiencyLevel:
          type: string
          enum: [beginner, intermediate, advanced]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          type: string
          enum: [pending, approved, rejected, disputed]
        evidenceSummary:
          type: string
          nullable: true
    GitHubStatus:
      type: object
      required:
        - connected
        - username
      properties:
        connected:
          type: boolean
        username:
          type: string
          nullable: true
    ReputationSummary:
      type: object
      required:
        - rating
        - reviewsCount
      properties:
        rating:
          type: number
          nullable: true
        reviewsCount:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
