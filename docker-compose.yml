version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sha-rek-api
    command: sh -c "npx prisma generate && npm run start:dev"
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://sharek:sharekSecurePass2026@postgres:5432/sharek_db
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=jlVa_hzqZ55_EJDahAdTBx_access_secret_key
      - JWT_REFRESH_SECRET=jlVa_hzqZ55_EJDahAdTBx_refresh_secret_key
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sha-rek-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sha-rek-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sharek
      - POSTGRES_PASSWORD=sharekSecurePass2026
      - POSTGRES_DB=sharek_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharek -d sharek_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sha-rek-network

  redis:
    image: redis:7-alpine
    container_name: sha-rek-redis
    ports:
      - "6379:6379"
    networks:
      - sha-rek-network

volumes:
  postgres_data:

networks:
  sha-rek-network:
    driver: bridge