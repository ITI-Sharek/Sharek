services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sha-rek-api
    command: sh -c "npx prisma generate && npm run start:dev"
    ports:
      - "${PORT:-3000}:3000"
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sharek:sharek@postgres:5432/sharek?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-http://localhost:3000/github/oauth/callback}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-change-this-github-token-encryption-key-32-chars-min}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8000}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-5000}
      AI_SERVICE_AUTH_TOKEN: ${AI_SERVICE_AUTH_TOKEN:-}
      AI_LOW_CONFIDENCE_THRESHOLD: ${AI_LOW_CONFIDENCE_THRESHOLD:-0.70}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sha-rek-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sha-rek-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharek}
      POSTGRES_DB: ${POSTGRES_DB:-sharek}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sha-rek-network

  redis:
    image: redis:7-alpine
    container_name: sha-rek-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - sha-rek-network

volumes:
  postgres_data:

networks:
  sha-rek-network:
    driver: bridge
