services:
  backend:
    build:
      context: .
    command: npm run start:dev
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sharek
      POSTGRES_PASSWORD: sharek
      POSTGRES_DB: sharek
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharek -d sharek"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  backend_node_modules:
  postgres_data:
