services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sha-rek-api
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run start:dev:docker"
    ports:
      - "${API_HOST_PORT:-4000}:${PORT:-4000}"
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sharek:sharek@postgres:5432/sharek?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REALTIME_NOTIFICATIONS_ENABLED: ${REALTIME_NOTIFICATIONS_ENABLED:-true}
      NOTIFICATION_EVENT_RECOVERY_QUEUE_ENABLED: ${NOTIFICATION_EVENT_RECOVERY_QUEUE_ENABLED:-true}
      NOTIFICATION_EVENT_RECOVERY_INTERVAL_MS: ${NOTIFICATION_EVENT_RECOVERY_INTERVAL_MS:-60000}
      NOTIFICATION_EVENT_RECOVERY_BATCH_SIZE: ${NOTIFICATION_EVENT_RECOVERY_BATCH_SIZE:-100}
      NOTIFICATION_EVENT_MAX_PUBLISH_ATTEMPTS: ${NOTIFICATION_EVENT_MAX_PUBLISH_ATTEMPTS:-5}
      SKILL_PROFILE_QUEUE_ENABLED: ${SKILL_PROFILE_QUEUE_ENABLED:-true}
      SKILL_PROFILE_QUEUE_CONCURRENCY: ${SKILL_PROFILE_QUEUE_CONCURRENCY:-2}
      APPLICATION_REVIEW_QUEUE_ENABLED: ${APPLICATION_REVIEW_QUEUE_ENABLED:-true}
      DELIVERY_REPUTATION_QUEUE_ENABLED: ${DELIVERY_REPUTATION_QUEUE_ENABLED:-true}
      ADVISORY_FIT_QUEUE_ENABLED: ${ADVISORY_FIT_QUEUE_ENABLED:-true}
      ADVISORY_FIT_REAP_INTERVAL_MS: ${ADVISORY_FIT_REAP_INTERVAL_MS:-60000}
      ADVISORY_FIT_STALE_AFTER_MS: ${ADVISORY_FIT_STALE_AFTER_MS:-600000}
      MATERIAL_STORAGE_ROOT: ${MATERIAL_STORAGE_ROOT:-/usr/src/app/.material-storage}
      MATERIAL_MAX_BYTES: ${MATERIAL_MAX_BYTES:-26214400}
      MATERIAL_ALLOWED_MIME_TYPES: ${MATERIAL_ALLOWED_MIME_TYPES:-application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/markdown,text/plain}
      MATERIAL_SCAN_QUEUE_ENABLED: ${MATERIAL_SCAN_QUEUE_ENABLED:-true}
      MATERIAL_SCAN_REAP_INTERVAL_MS: ${MATERIAL_SCAN_REAP_INTERVAL_MS:-60000}
      MATERIAL_SCAN_STALE_AFTER_MS: ${MATERIAL_SCAN_STALE_AFTER_MS:-600000}
      MATERIAL_SCAN_MAX_ATTEMPTS: ${MATERIAL_SCAN_MAX_ATTEMPTS:-3}
      MATERIAL_SCANNER_STUB_MODE: ${MATERIAL_SCANNER_STUB_MODE:-content}
      MATERIAL_DOWNLOAD_TOKEN_SECRET: ${MATERIAL_DOWNLOAD_TOKEN_SECRET:?Set MATERIAL_DOWNLOAD_TOKEN_SECRET in .env or the shell environment}
      MATERIAL_DOWNLOAD_TOKEN_TTL_SECONDS: ${MATERIAL_DOWNLOAD_TOKEN_TTL_SECONDS:-300}
      MATERIAL_ANALYSIS_ENABLED: ${MATERIAL_ANALYSIS_ENABLED:-true}
      MATERIAL_ANALYSIS_REQUIRE_SUBSCRIPTION: ${MATERIAL_ANALYSIS_REQUIRE_SUBSCRIPTION:-false}
      MATERIAL_ANALYSIS_MIN_PLAN: ${MATERIAL_ANALYSIS_MIN_PLAN:-gold}
      MATERIAL_ANALYSIS_MAX_DOCUMENTS: ${MATERIAL_ANALYSIS_MAX_DOCUMENTS:-5}
      MATERIAL_ANALYSIS_MAX_EXTRACTED_CHARACTERS: ${MATERIAL_ANALYSIS_MAX_EXTRACTED_CHARACTERS:-250000}
      MATERIAL_ANALYSIS_QUEUE_ENABLED: ${MATERIAL_ANALYSIS_QUEUE_ENABLED:-true}
      MATERIAL_ANALYSIS_REAP_INTERVAL_MS: ${MATERIAL_ANALYSIS_REAP_INTERVAL_MS:-60000}
      MATERIAL_ANALYSIS_STALE_AFTER_MS: ${MATERIAL_ANALYSIS_STALE_AFTER_MS:-600000}
      CHAT_ATTACHMENTS_ENABLED: ${CHAT_ATTACHMENTS_ENABLED:-false}
      CHAT_ATTACHMENT_MAX_BYTES: ${CHAT_ATTACHMENT_MAX_BYTES:-26214400}
      CHAT_ATTACHMENT_MAX_PER_MESSAGE: ${CHAT_ATTACHMENT_MAX_PER_MESSAGE:-5}
      CHAT_ATTACHMENT_ALLOWED_MIME_TYPES: ${CHAT_ATTACHMENT_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
      CHAT_ATTACHMENT_UPLOAD_INTENT_TTL_SECONDS: ${CHAT_ATTACHMENT_UPLOAD_INTENT_TTL_SECONDS:-1800}
      CHAT_ATTACHMENT_UPLOADS_PER_MINUTE: ${CHAT_ATTACHMENT_UPLOADS_PER_MINUTE:-20}
      CHAT_ATTACHMENT_SCAN_QUEUE_ENABLED: ${CHAT_ATTACHMENT_SCAN_QUEUE_ENABLED:-true}
      CHAT_ATTACHMENT_SCAN_REAP_INTERVAL_MS: ${CHAT_ATTACHMENT_SCAN_REAP_INTERVAL_MS:-60000}
      CHAT_ATTACHMENT_SCAN_STALE_AFTER_MS: ${CHAT_ATTACHMENT_SCAN_STALE_AFTER_MS:-600000}
      CHAT_ATTACHMENT_SCAN_MAX_ATTEMPTS: ${CHAT_ATTACHMENT_SCAN_MAX_ATTEMPTS:-3}
      CHAT_ATTACHMENT_SCANNER_STUB_MODE: ${CHAT_ATTACHMENT_SCANNER_STUB_MODE:-content}
      CHAT_ATTACHMENT_EVENT_MAX_PUBLISH_ATTEMPTS: ${CHAT_ATTACHMENT_EVENT_MAX_PUBLISH_ATTEMPTS:-5}
      CHAT_ATTACHMENT_DOWNLOAD_URL_TTL_SECONDS: ${CHAT_ATTACHMENT_DOWNLOAD_URL_TTL_SECONDS:-60}
      CHAT_ATTACHMENT_RETENTION_MONTHS: ${CHAT_ATTACHMENT_RETENTION_MONTHS:-12}
      CHAT_ATTACHMENT_RETENTION_WARNING_DAYS: ${CHAT_ATTACHMENT_RETENTION_WARNING_DAYS:-30}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_CHAT_ATTACHMENTS_BUCKET: ${S3_CHAT_ATTACHMENTS_BUCKET:-sharek-chat-attachments}
      S3_CHAT_ATTACHMENTS_KEY_PREFIX: ${S3_CHAT_ATTACHMENTS_KEY_PREFIX:-chat-attachments/}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sharek-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sharek-minio-secret}
      # Preserve an explicit empty value for local MinIO, which has no KMS by
      # default. If unset, production-compatible AES256 remains the default.
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION-AES256}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      S3_REQUEST_TIMEOUT_MS: ${S3_REQUEST_TIMEOUT_MS:-15000}
      ASSIGNMENT_CALLS_ENABLED: ${ASSIGNMENT_CALLS_ENABLED:-false}
      ASSIGNMENT_CALL_RING_TIMEOUT_MS: ${ASSIGNMENT_CALL_RING_TIMEOUT_MS:-30000}
      ASSIGNMENT_CALL_RECONNECT_GRACE_MS: ${ASSIGNMENT_CALL_RECONNECT_GRACE_MS:-30000}
      ASSIGNMENT_CALL_MAX_DURATION_MS: ${ASSIGNMENT_CALL_MAX_DURATION_MS:-3600000}
      ASSIGNMENT_CALL_WARNING_MS: ${ASSIGNMENT_CALL_WARNING_MS:-3000000,3480000}
      ASSIGNMENT_CALL_QUEUE_ENABLED: ${ASSIGNMENT_CALL_QUEUE_ENABLED:-true}
      ASSIGNMENT_CALL_SWEEP_INTERVAL_MS: ${ASSIGNMENT_CALL_SWEEP_INTERVAL_MS:-60000}
      ASSIGNMENT_CALL_EVENT_MAX_PUBLISH_ATTEMPTS: ${ASSIGNMENT_CALL_EVENT_MAX_PUBLISH_ATTEMPTS:-5}
      ASSIGNMENT_CALL_SIGNAL_MAX_SDP_BYTES: ${ASSIGNMENT_CALL_SIGNAL_MAX_SDP_BYTES:-65536}
      ASSIGNMENT_CALL_SIGNALS_PER_10S: ${ASSIGNMENT_CALL_SIGNALS_PER_10S:-60}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-sharek-turn-dev-secret-please-change}
      TURN_REALM: ${TURN_REALM:-sharek.local}
      TURN_URLS: ${TURN_URLS:-turn:coturn:3478?transport=udp,turn:coturn:3478?transport=tcp}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-300}
      TURN_MONTHLY_BUDGET_BYTES: ${TURN_MONTHLY_BUDGET_BYTES:-53687091200}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302,stun:stun.cloudflare.com:3478}
      APPLICATION_REVIEW_SWEEP_INTERVAL_MS: ${APPLICATION_REVIEW_SWEEP_INTERVAL_MS:-60000}
      APPLICATION_REVIEW_SWEEP_BATCH_SIZE: ${APPLICATION_REVIEW_SWEEP_BATCH_SIZE:-100}
      DELIVERY_REPUTATION_SWEEP_INTERVAL_MS: ${DELIVERY_REPUTATION_SWEEP_INTERVAL_MS:-60000}
      NOTIFICATION_RETENTION_QUEUE_ENABLED: ${NOTIFICATION_RETENTION_QUEUE_ENABLED:-true}
      NOTIFICATION_RETENTION_INTERVAL_MS: ${NOTIFICATION_RETENTION_INTERVAL_MS:-60000}
      NOTIFICATION_RETENTION_BATCH_SIZE: ${NOTIFICATION_RETENTION_BATCH_SIZE:-100}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_API_OVERALL_TIMEOUT_MS: ${GITHUB_API_OVERALL_TIMEOUT_MS:-8000}
      GITHUB_API_REQUEST_TIMEOUT_MS: ${GITHUB_API_REQUEST_TIMEOUT_MS:-8000}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-http://localhost:4000/auth/github/callback/repository}
      GITHUB_AUTH_CALLBACK_URL: ${GITHUB_AUTH_CALLBACK_URL:-http://localhost:4000/auth/github/callback}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-change-this-github-token-encryption-key-32-chars-min}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_WEBHOOK_PROXY_URL: ${GITHUB_APP_WEBHOOK_PROXY_URL:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_INSTALLATION_URL: ${GITHUB_APP_INSTALLATION_URL:-https://github.com/apps/your-app-slug/installations/new}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:4000/auth/github/app/callback}
      GITHUB_APP_FRONTEND_RETURN_URL: ${GITHUB_APP_FRONTEND_RETURN_URL:-http://localhost:3001/settings?section=github}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8010}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-60000}
      AI_ADVISORY_FIT_TIMEOUT_MS: ${AI_ADVISORY_FIT_TIMEOUT_MS:-75000}
      AI_SKILL_GAP_GUIDANCE_PATH: ${AI_SKILL_GAP_GUIDANCE_PATH:-/gap-guidance/generate}
      AI_SKILL_GAP_GUIDANCE_TIMEOUT_MS: ${AI_SKILL_GAP_GUIDANCE_TIMEOUT_MS:-75000}
      AI_SERVICE_AUTH_TOKEN: ${AI_SERVICE_AUTH_TOKEN:-}
      AI_MATERIAL_ANALYSIS_PATH: ${AI_MATERIAL_ANALYSIS_PATH:-/material-analysis/analyze}
      AI_MATERIAL_ANALYSIS_TIMEOUT_MS: ${AI_MATERIAL_ANALYSIS_TIMEOUT_MS:-135000}
      AI_LOW_CONFIDENCE_THRESHOLD: ${AI_LOW_CONFIDENCE_THRESHOLD:-0.70}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:4000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - material_storage:/usr/src/app/.material-storage
      - api_build:/usr/src/app/.docker-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      coturn:
        condition: service_started
    networks:
      - sha-rek-network

  # Local-dev-only TURN relay. Production uses a managed provider (Cloudflare
  # Realtime TURN, Twilio NTS as fallback) -- never self-hosted coturn there,
  # per ADR 0016: that would mean operating a UDP relay across a wide port
  # range plus its own bandwidth bill, exactly the surface the ADR avoids by
  # not running an SFU.
  coturn:
    image: coturn/coturn:latest
    container_name: sha-rek-coturn
    command: >
      -n
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --realm=${TURN_REALM:-sharek.local}
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-sharek-turn-dev-secret-please-change}
      --no-tls
      --no-dtls
      --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - sha-rek-network

  minio:
    image: minio/minio:latest
    container_name: sha-rek-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sharek-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-sharek-minio-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sha-rek-network

  # One-shot: creates the chat-attachments bucket, then exits. The app must
  # never hold s3:CreateBucket -- provisioning the bucket is infrastructure's
  # job, not a runtime privilege the API carries.
  minio-init:
    image: minio/mc:latest
    container_name: sha-rek-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-sharek-minio} ${S3_SECRET_ACCESS_KEY:-sharek-minio-secret} &&
      mc mb --ignore-existing local/${S3_CHAT_ATTACHMENTS_BUCKET:-sharek-chat-attachments}
      "
    networks:
      - sha-rek-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sha-rek-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharek}
      POSTGRES_DB: ${POSTGRES_DB:-sharek}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sha-rek-network

  redis:
    image: redis:7-alpine
    container_name: sha-rek-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - sha-rek-network

volumes:
  postgres_data:
  api_build:
  material_storage:
  minio_data:

networks:
  sha-rek-network:
    driver: bridge
