name: CI

on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-governance:
    name: PR governance
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch and PR title
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          branch_pattern='^(issue-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*|docs/[a-z0-9][a-z0-9._-]*|chore/[a-z0-9][a-z0-9._-]*|fix/[a-z0-9][a-z0-9._-]*)$'
          title_pattern='^(S[0-9]+-[0-9]{2}|Issue #[0-9]+): .+'

          echo "Base branch: ${BASE_BRANCH}"
          echo "Head branch: ${HEAD_BRANCH}"
          echo "PR title: ${PR_TITLE}"

          if ! printf '%s' "$HEAD_BRANCH" | grep -Eq "$branch_pattern"; then
            echo "Invalid branch name: ${HEAD_BRANCH}"
            echo "Expected one of:"
            echo "- issue-<number>-<short-kebab-description>"
            echo "- docs/<short-name>"
            echo "- chore/<short-name>"
            echo "- fix/<short-name>"
            exit 1
          fi

          if ! printf '%s' "$PR_TITLE" | grep -Eq "$title_pattern"; then
            echo "Invalid PR title: ${PR_TITLE}"
            echo "Expected:"
            echo "- S1-01: Short imperative summary"
            echo "- Issue #6: Short imperative summary"
            exit 1
          fi

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify frozen workspace lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required frontend scripts
        run: >-
          node -e "const scripts=require('./frontend/package.json').scripts||{};
          const required=['lint','typecheck','test','build'];
          const missing=required.filter((name)=>!scripts[name]);
          if(missing.length){console.error('Missing frontend scripts: '+missing.join(', '));process.exit(1)}"

      - name: Lint
        run: pnpm --filter ./frontend lint

      - name: Type-check
        run: pnpm --filter ./frontend typecheck

      - name: Test
        run: pnpm --filter ./frontend test

      - name: Build
        run: pnpm --filter ./frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://sharek:sharek@localhost:5432/sharek?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter ./backend exec prisma generate

      - name: Lint
        run: pnpm --filter ./backend lint

      - name: Type-check
        run: pnpm --filter ./backend exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter ./backend test --runInBand --testPathPattern=src

      - name: Integration and E2E tests
        run: pnpm --filter ./backend test --runInBand --testPathPattern=test

      - name: Check architecture
        run: pnpm --filter ./backend check:architecture

      - name: Validate Prisma schema
        run: pnpm --filter ./backend exec prisma validate

      - name: Build
        run: pnpm --filter ./backend build

  ai:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Verify pinned Python dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          req = Path("ai/requirements.txt")
          unpinned = []
          for raw in req.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or line.startswith(("-r ", "--")):
                  continue
              if not re.search(r"(==|===)", line):
                  unpinned.append(line)
          if unpinned:
              print("Unpinned ai/requirements.txt entries:")
              for item in unpinned:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

      - name: Install AI dependencies
        run: python -m pip install --requirement ai/requirements.txt

      - name: Lint
        run: python -m pylint --disable=all --enable=E,F ai/src/sharek_agents

      - name: Compile Python modules
        run: python -m compileall -q ai/src/sharek_agents

      - name: Report AI tests
        run: |
          python - <<'PY'
          from pathlib import Path
          tests = [
              path
              for path in Path("ai").rglob("*.py")
              if path.name.startswith("test_") or path.name.endswith("_test.py")
          ]
          if not tests:
              print("No AI unit or contract tests found under ai/.")
              print("AI tests are explicitly skipped until test files exist.")
          else:
              print("AI test files detected:")
              for path in tests:
                  print(f"- {path}")
          PY

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - pr-governance
      - repository-checks
      - frontend
      - backend
      - ai
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          PR_GOVERNANCE_RESULT: ${{ needs.pr-governance.result }}
          REPOSITORY_CHECKS_RESULT: ${{ needs.repository-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          AI_RESULT: ${{ needs.ai.result }}
        run: |
          for result in "$PR_GOVERNANCE_RESULT" "$REPOSITORY_CHECKS_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT" "$AI_RESULT"; do
            if [ "$result" = "skipped" ]; then
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed: $result"
              exit 1
            fi
          done
