name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify frozen workspace lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required frontend scripts
        run: >-
          node -e "const scripts=require('./frontend/package.json').scripts||{};
          const required=['lint','typecheck','test','build'];
          const missing=required.filter((name)=>!scripts[name]);
          if(missing.length){console.error('Missing frontend scripts: '+missing.join(', '));process.exit(1)}"

      - name: Lint
        run: pnpm --filter ./frontend lint

      - name: Type-check
        run: pnpm --filter ./frontend typecheck

      - name: Test
        run: pnpm --filter ./frontend test

      - name: Build
        run: pnpm --filter ./frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter ./backend exec prisma generate

      - name: Lint
        run: pnpm --filter ./backend lint

      - name: Type-check
        run: pnpm --filter ./backend exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter ./backend test --runInBand --testPathPattern=src

      - name: Integration and E2E tests
        run: pnpm --filter ./backend test --runInBand --testPathPattern=test

      - name: Check architecture
        run: pnpm --filter ./backend check:architecture

      - name: Validate Prisma schema
        run: pnpm --filter ./backend exec prisma validate

      - name: Build
        run: pnpm --filter ./backend build

  ai:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Verify pinned Python dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          req = Path("ai/requirements.txt")
          unpinned = []
          for raw in req.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or line.startswith(("-r ", "--")):
                  continue
              if not re.search(r"(==|===)", line):
                  unpinned.append(line)
          if unpinned:
              print("Unpinned ai/requirements.txt entries:")
              for item in unpinned:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

      - name: Install AI dependencies
        run: python -m pip install --requirement ai/requirements.txt

      - name: Lint
        run: python -m pylint ai/src/sharek_agents

      - name: Compile Python modules
        run: python -m compileall -q ai/src/sharek_agents

      - name: Verify AI tests are present
        run: |
          python - <<'PY'
          from pathlib import Path
          tests = [
              path
              for path in Path("ai").rglob("*.py")
              if path.name.startswith("test_") or path.name.endswith("_test.py")
          ]
          if not tests:
              print("No AI unit or contract tests found under ai/.")
              raise SystemExit(1)
          PY

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - repository-checks
      - frontend
      - backend
      - ai
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          REPOSITORY_CHECKS_RESULT: ${{ needs.repository-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          AI_RESULT: ${{ needs.ai.result }}
        run: |
          for result in "$REPOSITORY_CHECKS_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT" "$AI_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed: $result"
              exit 1
            fi
          done
