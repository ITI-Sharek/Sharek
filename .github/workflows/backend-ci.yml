name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sharek
          POSTGRES_PASSWORD: sharek
          POSTGRES_DB: sharek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharek -d sharek"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check architecture rules
        run: npm run check:architecture

      - name: Lint
        run: npm run lint

      - name: Verify Sprint 4 core contracts
        run: npm run test:release-gate:s4-core

      - name: Test
        run: npm test -- --runInBand

      - name: Test database migrations
        run: npm run test:migrations
        env:
          DATABASE_URL: postgresql://sharek:sharek@localhost:5432/sharek?schema=public

      - name: Build
        run: npm run build
