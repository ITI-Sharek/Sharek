name: Bug report
description: Report a reproducible defect in ShareK.
title: "[Bug]: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, access tokens, private repository content, or
        unnecessary personal data in the report.

  - type: textarea
    id: summary
    attributes:
      label: Summary and user impact
      description: What is broken, who is affected, and how severe is the impact?
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what currently happens, including relevant status or error output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the correct observable behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the defect.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include branch/revision, browser or runtime, and relevant service versions.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add redacted logs, screenshots, request IDs, or links that contain no secrets/private data.
    validations:
      required: false

  - type: textarea
    id: security-data
    attributes:
      label: Security and data implications
      description: Note authorization, privacy, migration, integrity, or external-API risk. Write None when not applicable.
    validations:
      required: true

  - type: textarea
    id: regression-test
    attributes:
      label: Regression test
      description: State the automated test that should fail before the fix and pass afterward.
    validations:
      required: true
